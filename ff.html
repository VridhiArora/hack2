<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - BMI Calculator</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f7fa; /* Soft light background */
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff; /* Clean white background for content */
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            text-align: left;
        }

        h1 {
            color: #34495e; /* Dark slate color for headings */
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-align: center; /* Center the main title */
            border-bottom: 2px solid #3498db; /* Underline effect */
            padding-bottom: 10px;
        }

        label {
            font-size: 1.1rem;
            color: #34495e; /* Dark slate color for labels */
            margin: 10px 0;
            display: block; /* Make labels block elements */
        }

        input[type="text"],
        input[type="email"],
        textarea,
        select {
            width: 100%; /* Full width for inputs */
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
            box-sizing: border-box; /* Include padding in width calculation */
        }

        input[type="submit"] {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 12px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background-color 0.3s;
            width: 100%; /* Full width button */
        }

        input[type="submit"]:hover {
            background-color: #2980b9; /* Darker blue on hover */
        }

        .thank-you {
            display: none;
            text-align: center;
            color: #27ae60; /* Green for success message */
            font-size: 1.2rem;
            margin-top: 20px;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            input[type="submit"] {
                font-size: 1rem;
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Feedback Form</h1>
        <form id="feedbackForm" onsubmit="handleSubmit(event)">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="feedbackType">Feedback Type:</label>
            <select id="feedbackType" name="feedbackType" required>
                <option value="" disabled selected>Select an option</option>
                <option value="Suggestion">Suggestion</option>
                <option value="Bug Report">Bug Report</option>
                <option value="General Feedback">General Feedback</option>
            </select>

            <label for="comments">Comments:</label>
            <textarea id="comments" name="comments" rows="4" required></textarea>

            <input type="submit" value="Submit Feedback">
        </form>

        <div class="thank-you" id="thankYouMessage">Thank you for your feedback!</div>
    </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault(); // Prevent form from submitting normally
            // Optionally handle form data here (e.g., send to a server)
            document.getElementById('feedbackForm').reset(); // Reset the form
            document.getElementById('thankYouMessage').style.display = 'block'; // Show thank you message
        }
    </script>

</body>

</html>
